name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.capacitor.js"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: npm ci

      - name: Build web app (mobile config)
        run: npx vite build --config vite.config.capacitor.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/leads-crm.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: leads-crm-apk
          path: out/leads-crm.apk

      - name: Publish to release (downloadable link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Leads CRM — Android (build automático)
          body: |
            APK de debug generado automáticamente desde `main` en cada cambio relevante.
            Instalación: descargá `leads-crm.apk` en el celular y abrilo (puede pedir habilitar
            "instalar apps de fuentes desconocidas" la primera vez).
          files: out/leads-crm.apk
          make_latest: false
